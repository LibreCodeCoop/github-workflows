name: Nextcloud release plan
description: Validate whether a Nextcloud app release is ready

inputs:
  version:
    description: Release version in MAJOR.MINOR.PATCH form
    required: true
  stable-branch:
    description: Stable branch that is allowed to release
    required: true
  milestone:
    description: Milestone title that must be closed with no open issues
    required: false
    default: ''
  blocker-queries:
    description: JSON array of GitHub issue search fragments that must return zero open items
    required: false
    default: '[]'
  appinfo-path:
    description: Path to the Nextcloud app info.xml
    required: false
    default: appinfo/info.xml
  changelog-path:
    description: Path to the changelog
    required: false
    default: CHANGELOG.md
  github-token:
    description: GitHub token used for milestone and blocker checks
    required: true

runs:
  using: composite
  steps:
    - name: Build release plan
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RELEASE_VERSION: ${{ inputs.version }}
        STABLE_BRANCH: ${{ inputs.stable-branch }}
        MILESTONE: ${{ inputs.milestone }}
        BLOCKER_QUERIES: ${{ inputs.blocker-queries }}
        APPINFO_PATH: ${{ inputs.appinfo-path }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/release_plan.py" \
          --version "$RELEASE_VERSION" \
          --stable-branch "$STABLE_BRANCH" \
          --current-ref "$GITHUB_REF_NAME" \
          --repository "$GITHUB_REPOSITORY" \
          --appinfo "$APPINFO_PATH" \
          --changelog "$CHANGELOG_PATH" \
          --milestone "$MILESTONE" \
          --blocker-queries-json "$BLOCKER_QUERIES" \
          --output release-plan.json

    - name: Add plan summary
      if: always()
      shell: bash
      run: |
        if [[ -f release-plan.json ]]; then
          {
            echo '## Release plan'
            echo
            echo '~~~json'
            cat release-plan.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
