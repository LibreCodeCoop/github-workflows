name: Verify Nextcloud App Store publication
description: Wait until a published app release is visible in the Nextcloud App Store API

inputs:
  app-name:
    description: Nextcloud app id
    required: true
  version:
    description: Release version, with or without the v prefix
    required: true
  nextcloud-platform:
    description: Minimum supported Nextcloud platform version
    required: true
  attempts:
    description: Maximum number of App Store API checks
    required: false
    default: '12'
  delay-seconds:
    description: Delay between checks
    required: false
    default: '10'

runs:
  using: composite
  steps:
    - name: Verify App Store publication
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        APP_VERSION: ${{ inputs.version }}
        NEXTCLOUD_PLATFORM: ${{ inputs.nextcloud-platform }}
        ATTEMPTS: ${{ inputs.attempts }}
        DELAY_SECONDS: ${{ inputs.delay-seconds }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/verify_appstore_publication.py" \
          --app-name "$APP_NAME" \
          --version "$APP_VERSION" \
          --platform "$NEXTCLOUD_PLATFORM" \
          --attempts "$ATTEMPTS" \
          --delay-seconds "$DELAY_SECONDS"
