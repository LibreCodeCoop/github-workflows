name: Setup release-tool
description: Install an exact LibreCode release-tool PHAR release and verify its published SHA-256.
inputs:
  version:
    description: Optional exact release-tool semantic version override, without a leading v.
    required: false
    default: ''
outputs:
  path:
    description: Absolute path to the verified release-tool PHAR.
    value: ${{ steps.install.outputs.path }}
  version:
    description: Installed release-tool version.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - id: install
      name: Download and verify release-tool
      shell: bash
      env:
        RELEASE_TOOL_VERSION: ${{ inputs.version }}
      run: bash "${{ github.action_path }}/setup.sh"
