name: Finalize merged release
description: Restore ReleasePreparation v1, authorize the merger, finalize the release, transition milestones and create the GitHub Release draft.

inputs:
  pull-request-number:
    description: Merged generated release PR number.
    required: true
  merger:
    description: GitHub login reported by pull_request.merged_by.
    required: true
  config-path:
    description: Consumer release configuration path.
    required: false
    default: .nextcloud-release.yml
  prepare-workflow-path:
    description: Consumer workflow path that produced the release preparation artifact.
    required: false
    default: .github/workflows/prepare-release.yml
  github-token:
    description: Caller token used for artifact restore and permission lookup.
    required: true
  app-slug:
    description: Public GitHub App slug used to resolve its client id.
    required: false
    default: librecode-workflow-automation
  app-private-key:
    description: GitHub App private key used for short-lived mutation tokens.
    required: true

outputs:
  prepared-release-id:
    description: PreparedRelease v1 id.
    value: ${{ steps.finalize.outputs.prepared-release-id }}
  release-draft-id:
    description: ReleaseDraft v1 id.
    value: ${{ steps.draft.outputs.release-draft-id }}
  github-release-id:
    description: GitHub Release id.
    value: ${{ steps.draft.outputs.github-release-id }}
  github-release-url:
    description: GitHub Release draft URL.
    value: ${{ steps.draft.outputs.github-release-url }}
  state-artifact-name:
    description: Deterministic artifact carrying finalized release state.
    value: ${{ steps.draft.outputs.state-artifact-name }}

runs:
  using: composite
  steps:
    - name: Validate GitHub App credentials
      shell: bash
      env:
        RELEASE_APP_SLUG: ${{ inputs.app-slug }}
        RELEASE_APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      run: |
        set -euo pipefail

        if [[ -z "${RELEASE_APP_SLUG}" ]]; then
          echo "::error::GitHub App slug is empty."
          exit 1
        fi
        if [[ -z "${RELEASE_APP_PRIVATE_KEY}" ]]; then
          echo "::error::GitHub App private key is empty. Configure LIBRECODE_WORKFLOW_APP_PRIVATE_KEY as an Actions secret in the consumer repository or organization."
          exit 1
        fi

    - id: restore
      name: Restore preparation contracts
      uses: $/actions/release-artifact-restore
      with:
        repository: ${{ github.repository }}
        artifact-name: release-preparation-pr-${{ inputs.pull-request-number }}
        destination: ${{ runner.temp }}/release-post-merge-state
        github-token: ${{ inputs.github-token }}
        expected-event: workflow_dispatch
        expected-workflow-path: ${{ inputs.prepare-workflow-path }}

    - id: setup
      name: Setup release-tool
      uses: $/actions/release-tool-setup

    - id: authorization-config
      name: Read merge authorization policy
      shell: bash
      env:
        RELEASE_TOOL_PATH: ${{ steps.setup.outputs.path }}
        RELEASE_CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        set -euo pipefail
        config_file="${RUNNER_TEMP}/release-post-merge-config.json"
        php "${RELEASE_TOOL_PATH}" config:validate --config "${RELEASE_CONFIG_PATH}" --root . --json > "${config_file}"
        minimum_permission="$(php -r '$c=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $c["authorization"]["merge_min_permission"];' "${config_file}")"
        echo "minimum-permission=${minimum_permission}" >> "${GITHUB_OUTPUT}"

    - name: Authorize release PR merger
      uses: $/actions/release-authorization
      with:
        repository: ${{ github.repository }}
        actor: ${{ inputs.merger }}
        minimum-permission: ${{ steps.authorization-config.outputs.minimum-permission }}
        github-token: ${{ inputs.github-token }}

    - id: repository
      name: Resolve repository identity
      shell: bash
      env:
        RELEASE_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "owner=${RELEASE_REPOSITORY%%/*}" >> "${GITHUB_OUTPUT}"
        echo "name=${RELEASE_REPOSITORY#*/}" >> "${GITHUB_OUTPUT}"

    - id: app-identity
      name: Resolve GitHub App client id
      shell: bash
      env:
        RELEASE_APP_SLUG: ${{ inputs.app-slug }}
        RELEASE_GITHUB_TOKEN: ${{ inputs.github-token }}
        RELEASE_GITHUB_API_URL: ${{ github.api_url }}
      run: |
        set -euo pipefail

        app_json="$(curl --fail --silent --show-error --location \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${RELEASE_GITHUB_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${RELEASE_GITHUB_API_URL}/apps/${RELEASE_APP_SLUG}")"
        client_id="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo $d["client_id"] ?? "";' <<< "${app_json}")"
        if [[ -z "${client_id}" ]]; then
          echo "::error::GitHub App metadata did not contain a client_id for ${RELEASE_APP_SLUG}."
          exit 1
        fi
        echo "client-id=${client_id}" >> "${GITHUB_OUTPUT}"

    - id: finalization-token
      name: Create finalization token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ steps.app-identity.outputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.repository.outputs.owner }}
        repositories: ${{ steps.repository.outputs.name }}
        permission-contents: write
        permission-pull-requests: write

    - id: finalize
      name: Revalidate merged release and synchronize aggregate history
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.finalization-token.outputs.token }}
        RELEASE_TOOL_PATH: ${{ steps.setup.outputs.path }}
        RELEASE_CONFIG_PATH: ${{ inputs.config-path }}
        RELEASE_STATE_DIR: ${{ runner.temp }}/release-post-merge-state
      run: |
        set -euo pipefail
        set +e
        php "${RELEASE_TOOL_PATH}" release:finalize \
          --preparation "${RELEASE_STATE_DIR}/release-preparation.json" \
          --config "${RELEASE_CONFIG_PATH}" \
          --root . \
          --apply-history-sync \
          --json \
          > "${RELEASE_STATE_DIR}/prepared-release.json"
        status=$?
        set -e
        if [[ "${status}" -ne 0 ]]; then
          cat "${RELEASE_STATE_DIR}/prepared-release.json" || true
          exit "${status}"
        fi
        prepared_id="$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $p["id"];' "${RELEASE_STATE_DIR}/prepared-release.json")"
        echo "prepared-release-id=${prepared_id}" >> "${GITHUB_OUTPUT}"

        {
          echo "## History synchronization"
          echo
          php -r '
            $p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
            $items=$p["history_synchronizations"] ?? [$p["history_synchronization"]];
            foreach ($items as $item) {
                $branch=$item["target_branch"];
                $state=$item["state"];
                $pr=$item["pull_request"] ?? null;
                if (is_array($pr) && isset($pr["url"], $pr["number"])) {
                    printf("- `%s`: **%s** — [#%d](%s)\n", $branch, $state, $pr["number"], $pr["url"]);
                } else {
                    printf("- `%s`: **%s**\n", $branch, $state);
                }
            }
          ' "${RELEASE_STATE_DIR}/prepared-release.json"
        } >> "${GITHUB_STEP_SUMMARY}"

    - id: milestone
      name: Apply milestone transition
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RELEASE_TOOL_PATH: ${{ steps.setup.outputs.path }}
        RELEASE_CONFIG_PATH: ${{ inputs.config-path }}
        RELEASE_STATE_DIR: ${{ runner.temp }}/release-post-merge-state
      run: |
        set -euo pipefail
        create_follow_up="$(php -r '$p=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo !empty($p["create_follow_up_milestone"]) ? "true" : "false";' "${RELEASE_STATE_DIR}/release-plan.json")"
        args=(
          milestone:transition
          --prepared "${RELEASE_STATE_DIR}/prepared-release.json"
          --config "${RELEASE_CONFIG_PATH}"
          --root .
          --apply
          --json
        )
        if [[ "${create_follow_up}" == "true" ]]; then
          args+=(--create-follow-up)
        fi
        php "${RELEASE_TOOL_PATH}" "${args[@]}" > "${RELEASE_STATE_DIR}/milestone-transition.json"

    - id: draft-token
      name: Create release draft token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ steps.app-identity.outputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.repository.outputs.owner }}
        repositories: ${{ steps.repository.outputs.name }}
        permission-contents: write
        permission-pull-requests: read

    - id: draft
      name: Create or update GitHub Release draft
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.draft-token.outputs.token }}
        RELEASE_TOOL_PATH: ${{ steps.setup.outputs.path }}
        RELEASE_CONFIG_PATH: ${{ inputs.config-path }}
        RELEASE_STATE_DIR: ${{ runner.temp }}/release-post-merge-state
        PREPARED_RELEASE_ID: ${{ steps.finalize.outputs.prepared-release-id }}
      run: |
        set -euo pipefail
        set +e
        php "${RELEASE_TOOL_PATH}" release:draft \
          --prepared "${RELEASE_STATE_DIR}/prepared-release.json" \
          --milestone "${RELEASE_STATE_DIR}/milestone-transition.json" \
          --config "${RELEASE_CONFIG_PATH}" \
          --root . \
          --json \
          > "${RELEASE_STATE_DIR}/release-draft.json"
        status=$?
        set -e
        if [[ "${status}" -ne 0 ]]; then
          cat "${RELEASE_STATE_DIR}/release-draft.json" || true
          exit "${status}"
        fi

        draft_id="$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $d["id"];' "${RELEASE_STATE_DIR}/release-draft.json")"
        release_id="$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $d["github_release"]["id"];' "${RELEASE_STATE_DIR}/release-draft.json")"
        release_url="$(php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $d["github_release"]["url"];' "${RELEASE_STATE_DIR}/release-draft.json")"
        artifact_name="release-state-${release_id}"
        echo "release-draft-id=${draft_id}" >> "${GITHUB_OUTPUT}"
        echo "github-release-id=${release_id}" >> "${GITHUB_OUTPUT}"
        echo "github-release-url=${release_url}" >> "${GITHUB_OUTPUT}"
        echo "state-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"

        {
          echo "## Release draft"
          echo
          printf -- '- Prepared release: `%s`\n' "${PREPARED_RELEASE_ID}"
          printf -- '- Draft: `%s`\n' "${draft_id}"
          echo "- GitHub Release: ${release_url}"
          printf -- '- State artifact: `%s`\n' "${artifact_name}"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Persist finalized release contracts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.draft.outputs.state-artifact-name }}
        path: ${{ runner.temp }}/release-post-merge-state
        if-no-files-found: error
