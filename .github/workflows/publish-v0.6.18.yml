name: Publish github-workflows v0.6.18
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.6.18.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: v0.6.18
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [[ -n "${remote_sha}" ]]; then
            if [[ "${remote_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::${TAG} already exists at ${remote_sha}, expected ${GITHUB_SHA}"
              exit 1
            fi
            git tag "${TAG}" "${GITHUB_SHA}" 2>/dev/null || true
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish GitHub release
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 0
          fi
          gh release create "${TAG}"             --verify-tag             --title "${TAG}"             --generate-notes
