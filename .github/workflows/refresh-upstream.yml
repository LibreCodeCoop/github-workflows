name: Refresh upstream workflows

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh pinned upstream sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh upstream pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_upstream.py refresh upstream/sources.json

      - name: Verify refreshed immutable sources
        run: python3 scripts/sync_upstream.py check upstream/sources.json

      - name: Apply downstream patches
        id: render
        continue-on-error: true
        run: |
          python3 scripts/render_upstream.py sync upstream/templates.json \
            --report render-report.json

      - name: Run unit tests
        if: always()
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build pull request report
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("render-report.json")
          body_path = Path("refresh-upstream-pr.md")

          lines = [
              "Automated refresh of tracked upstream workflow sources.",
              "",
              "The source URLs in this change are pinned to immutable commit SHAs "
              "and SHA-256 hashes.",
              "",
          ]

          if not report_path.is_file():
              lines.extend([
                  "## Patch status",
                  "",
                  "No patch report was produced. Review the workflow run before merging.",
              ])
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              lines.extend([
                  "## Patch status",
                  "",
                  f"- Updated templates: {report['updated']}",
                  f"- Unchanged templates: {report['unchanged']}",
                  f"- Failed templates: {report['failed']}",
                  "",
              ])

              for item in report["templates"]:
                  status = item["status"]
                  icon = {"updated": "✅", "unchanged": "➖", "failed": "❌"}[status]
                  lines.append(f"### {icon} {item['name']} — {status}")
                  lines.append("")
                  lines.append(f"Destination: {item['destination']}")
                  if item["patches"]:
                      lines.append("")
                      lines.append("Patches:")
                      for patch in item["patches"]:
                          lines.append(f"- {patch}")
                  if status == "failed":
                      lines.extend([
                          "",
                          "Patch application failed:",
                          "",
                          "~~~text",
                          str(item["error"]),
                          "~~~",
                          "",
                          "The vendored upstream source was updated, but the generated "
                          "template was left unchanged and needs manual patch adjustment.",
                      ])
                  lines.append("")

          lines.extend([
              "Review upstream changes and downstream patches before merging.",
              "",
          ])
          body_path.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Create update pull request
        id: pull-request
        if: always()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
          commit-message: 'chore: refresh upstream workflow pins'
          committer: GitHub <noreply@github.com>
          author: github-workflows bot <noreply@github.com>
          signoff: true
          branch: automated/refresh-upstream-workflows
          delete-branch: true
          title: 'chore: refresh upstream workflows'
          body-path: refresh-upstream-pr.md
          draft: ${{ steps.render.outcome == 'failure' }}
          labels: dependencies
          add-paths: |
            upstream/sources.json
            upstream/vendor/**
            templates/**

      - name: Fail when patches need manual updates
        if: steps.render.outcome == 'failure'
        run: |
          echo "One or more downstream patches could not be applied."
          exit 1
