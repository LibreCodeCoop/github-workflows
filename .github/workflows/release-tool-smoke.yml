name: Release tool setup smoke test

on:
  pull_request:
    paths:
      - 'actions/release-tool-setup/**'
      - 'tests/test_release_tool_setup_action.py'
      - '.github/workflows/release-tool-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'actions/release-tool-setup/**'
      - '.github/workflows/release-tool-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - id: release-tool
        uses: $/actions/release-tool-setup
        with:
          version: '0.1.0'
      - name: Verify installed PHAR
        env:
          RELEASE_TOOL_PATH: ${{ steps.release-tool.outputs.path }}
        run: php "${RELEASE_TOOL_PATH}" --version | grep -F '0.1.0'
