name: First merged contribution

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to process or retry
        required: true
        type: string

permissions: {}

concurrency:
  group: >-
    first-merged-contribution-${{
      github.event.pull_request.number ||
      inputs.pull_request_number ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  first-merged-contribution:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.type != 'Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    env:
      FIRST_MERGED_CONTRIBUTION_MESSAGE: ${{ vars.FIRST_MERGED_CONTRIBUTION_MESSAGE }}
      CONTRIBUTOR_SURVEY_URL: ${{ vars.CONTRIBUTOR_SURVEY_URL }}
      COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
      MANUAL_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number || '' }}

    steps:
      # pull_request_target is intentionally used without checkout. No code,
      # artifacts, scripts or other content from the pull request are executed.
      - name: Thank first merged contributor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            let pr = context.payload.pull_request

            if (!pr) {
              const pullNumber = Number(process.env.MANUAL_PULL_REQUEST_NUMBER)
              if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
                core.setFailed('A valid pull_request_number is required for a manual run.')
                return
              }

              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              })
              pr = response.data
            }

            if (!pr?.merged || pr.user?.type === 'Bot') {
              core.info('Pull request is not a merged human contribution; skipping.')
              return
            }

            const query = [
              `repo:${owner}/${repo}`,
              'is:pr',
              'is:merged',
              `author:${pr.user.login}`,
              `closed:<=${pr.closed_at}`,
            ].join(' ')

            const result = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 2,
            })

            if (result.data.total_count !== 1) {
              core.info(
                `PR #${pr.number} is not the author's first merged pull request; found ${result.data.total_count} merged PRs up to this one.`,
              )
              return
            }

            const marker = '<!-- first-merged-contribution -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            })

            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info(`PR #${pr.number} already has a first-contribution message; skipping.`)
              return
            }

            const surveyBase = (process.env.CONTRIBUTOR_SURVEY_URL || '').trim()
            const communityUrl = (process.env.COMMUNITY_URL || '').trim()
            const customMessage = (process.env.FIRST_MERGED_CONTRIBUTION_MESSAGE || '').trim()

            let surveyUrl = ''
            if (surveyBase) {
              const separator = surveyBase.includes('?') ? '&' : '?'
              surveyUrl = `${surveyBase}${separator}source=github-first-merged-pr&repository=${encodeURIComponent(repo)}`
            }

            const replacements = {
              '{user}': `@${pr.user.login}`,
              '{repository}': repo,
              '{pull_request}': String(pr.number),
              '{survey_url}': surveyUrl,
              '{community_url}': communityUrl,
            }

            let message
            if (customMessage) {
              message = customMessage
              for (const [placeholder, value] of Object.entries(replacements)) {
                message = message.split(placeholder).join(value)
              }
            } else {
              const lines = [
                `Hi @${pr.user.login}, your first pull request to ${repo} has been merged. 🎉`,
                '',
                'Thank you for the time and knowledge you shared. You are very welcome to contribute again.',
              ]

              if (surveyUrl) {
                lines.push(
                  '',
                  `If you have a few minutes, we would appreciate your feedback: ${surveyUrl}. The survey is entirely optional.`,
                )
              }

              if (communityUrl) {
                lines.push('', `Community: ${communityUrl}`)
              }

              message = lines.join('\n')
            }

            if (!message.trim()) {
              core.setFailed('The rendered first-contribution message is empty.')
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: `${marker}\n${message}`,
            })
